<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OSC Engine - Core Search Engine</title>
  <style>
    :root {
      --bg-dark: #0c0f17;
      --card-bg: #1a2234;
      --border-color: #334155;
      --accent-color: #3b82f6;
      --accent-cyan: #06b6d4;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --shield-color: #10b981;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Encabezado del Motor */
    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--accent-color);
      letter-spacing: -0.5px;
    }

    .brand span {
      background: linear-gradient(135deg, var(--accent-color), var(--accent-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .search-box-container {
      flex: 1;
      max-width: 650px;
      display: flex;
      align-items: center;
      background: var(--bg-dark);
      border: 2px solid var(--border-color);
      border-radius: 50px;
      padding: 6px 16px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-box-container:focus-within {
      border-color: var(--accent-color);
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.3);
    }

    .search-box {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 1rem;
      padding: 8px;
    }

    .engine-btn {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .engine-btn:hover {
      opacity: 0.9;
    }

    /* Barra de estado e indicadores */
    .engine-stats {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .badge {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid var(--shield-color);
      color: #6ee7b7;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Filtros y Categorías */
    .filter-bar {
      padding: 12px 24px;
      display: flex;
      gap: 10px;
      border-bottom: 1px solid var(--border-color);
      background: rgba(26, 34, 52, 0.4);
      overflow-x: auto;
    }

    .filter-tag {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 16px;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .filter-tag.active, .filter-tag:hover {
      border-color: var(--accent-color);
      color: var(--text-main);
      background: var(--accent-color);
    }

    /* Panel Principal de Resultados */
    main {
      flex: 1;
      padding: 24px;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }

    .results-info {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .result-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 16px;
      transition: transform 0.2s, border-color 0.2s;
    }

    .result-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent-color);
    }

    .result-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .result-type {
      font-size: 0.72rem;
      text-transform: uppercase;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      background: rgba(59, 130, 246, 0.15);
      color: var(--accent-cyan);
      border: 1px solid rgba(6, 182, 212, 0.3);
    }

    .result-url {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-family: monospace;
    }

    .result-title {
      font-size: 1.15rem;
      margin-bottom: 6px;
    }

    .result-title a {
      color: #60a5fa;
      text-decoration: none;
      font-weight: 600;
    }

    .result-title a:hover {
      text-decoration: underline;
    }

    .result-snippet {
      font-size: 0.9rem;
      color: #cbd5e1;
      line-height: 1.5;
    }

    /* Estado de búsqueda vacía */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .empty-state icon {
      font-size: 3rem;
      display: block;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      ⚡ <span>OSC Engine</span>
    </div>

    <div class="search-box-container">
      <input type="text" id="engineQuery" class="search-box" placeholder="Busca conocimiento libre, recursos o webs sin anuncios..." value="JavaScript">
      <button class="engine-btn" onclick="executeSearch()">Buscar</button>
    </div>

    <div class="engine-stats">
      <div class="badge">🛡️ AdBlock Protegido</div>
      <span id="speedCounter">⚡ 0 ms</span>
    </div>
  </header>

  <div class="filter-bar">
    <button class="filter-tag active" onclick="filterResults('all', this)">🌐 Todo</button>
    <button class="filter-tag" onclick="filterResults('open-source', this)">💻 Open Source</button>
    <button class="filter-tag" onclick="filterResults('media', this)">🎨 Medios Libres</button>
    <button class="filter-tag" onclick="filterResults('archive', this)">🏛️ Archivos</button>
    <button class="filter-tag" onclick="filterResults('wiki', this)">📚 Documentación</button>
  </div>

  <main>
    <div class="results-info" id="resultsCount">Resultados procesados por OSC Engine</div>
    <div id="resultsContainer"></div>
  </main>

  <script>
    /* Motor Central: Core de Indexación y Generación de Resultados Libres */
    class OSCEngineCore {
      constructor() {
        this.indexDatabase = [
          {
            title: "MDN Web Docs - Aprendizaje de JavaScript",
            url: "https://developer.mozilla.org",
            type: "wiki",
            category: "wiki",
            snippet: "Documentación libre de derechos mantenida por Mozilla. Recursos y guías completas sobre desarrollo con JavaScript, HTML5 y APIS de la web."
          },
          {
            title: "Wikimedia Commons - Colección de Contenido Abierto",
            url: "https://commons.wikimedia.org",
            type: "media",
            category: "media",
            snippet: "Repositorio con millones de archivos multimedia (imágenes, sonidos y videos) bajo licencias libres y de dominio público."
          },
          {
            title: "GitHub - Repositorios Abiertos y Proyectos Open Source",
            url: "https://github.com",
            type: "open-source",
            category: "open-source",
            snippet: "Explora código fuente libre, librerías universales, módulos de programación y proyectos creados por la comunidad internacional."
          },
          {
            title: "Internet Archive - Biblioteca Digital de Dominio Público",
            url: "https://archive.org",
            type: "archive",
            category: "archive",
            snippet: "Acceso ilimitado a millones de libros, software de preservación histórica, películas antiguas y capturas de la web sin fines de lucro."
          },
          {
            title: "Openverse - Motor de Búsqueda Creative Commons",
            url: "https://openverse.org",
            type: "media",
            category: "media",
            snippet: "Indexador con más de 600 millones de imágenes y archivos de audio bajo licencias abiertas listos para ser reutilizados gratuitamente."
          },
          {
            title: "Wikipedia en Español - Enciclopedia Libre",
            url: "https://es.wikipedia.org",
            type: "wiki",
            category: "wiki",
            snippet: "El proyecto enciclopédico de conocimiento libre más extenso de la red, editado y verificado por una comunidad global."
          }
        ];
      }

      search(query, categoryFilter = 'all') {
        const startTime = performance.now();
        const cleanQuery = query.toLowerCase().trim();

        let filtered = this.indexDatabase.filter(item => {
          const matchQuery = item.title.toLowerCase().includes(cleanQuery) || 
                             item.snippet.toLowerCase().includes(cleanQuery) ||
                             cleanQuery === '';
          const matchCategory = categoryFilter === 'all' || item.category === categoryFilter;
          return matchQuery && matchCategory;
        });

        // Si la búsqueda no coincide con la base simulada, generar enlaces de exploración directa en tiempo real
        if (filtered.length === 0 && cleanQuery !== '') {
          filtered = [
            {
              title: `Wikipedia: ${query}`,
              url: `https://es.wikipedia.org/wiki/${encodeURIComponent(query)}`,
              type: "wiki",
              category: "wiki",
              snippet: `Resultados enciclopédicos libres y verificados sobre "${query}" en el repositorio abierto de Wikipedia.`
            },
            {
              title: `Wikimedia Commons: Recursos sobre "${query}"`,
              url: `https://commons.wikimedia.org/w/index.php?search=${encodeURIComponent(query)}`,
              type: "media",
              category: "media",
              snippet: `Archivos multimedia, diagramas e imágenes de uso libre relacionados con "${query}".`
            },
            {
              title: `Openverse: Licencias Abiertas de "${query}"`,
              url: `https://openverse.org/search/?q=${encodeURIComponent(query)}`,
              type: "media",
              category: "media",
              snippet: `Búsqueda de elementos bajo Creative Commons para "${query}".`
            },
            {
              title: `Internet Archive: Registros de "${query}"`,
              url: `https://archive.org/details/texts?query=${encodeURIComponent(query)}`,
              type: "archive",
              category: "archive",
              snippet: `Textos históricos, software y documentos preservados en el dominio público.`
            }
          ];
        }

        const endTime = performance.now();
        const executionTime = Math.round((endTime - startTime) * 100) / 100;

        return {
          results: filtered,
          time: executionTime,
          total: filtered.length
        };
      }
    }

    const engineCore = new OSCEngineCore();
    let currentCategory = 'all';

    function executeSearch() {
      const query = document.getElementById('engineQuery').value;
      const searchData = engineCore.search(query, currentCategory);
      
      document.getElementById('speedCounter').textContent = `⚡ ${searchData.time} ms`;
      document.getElementById('resultsCount').textContent = `Se encontraron ${searchData.total} resultados libres para "${query || 'Todo'}"`;

      renderResults(searchData.results);
    }

    function renderResults(results) {
      const container = document.getElementById('resultsContainer');
      container.innerHTML = '';

      if (results.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <span style="font-size: 2.5rem; display:block; margin-bottom:10px;">🔍</span>
            <h3>No se encontraron resultados sin anuncios.</h3>
            <p>Intenta ajustar el término de búsqueda o selecciona la categoría "🌐 Todo".</p>
          </div>
        `;
        return;
      }

      results.forEach(item => {
        const card = document.createElement('div');
        card.className = 'result-card';
        card.innerHTML = `
          <div class="result-header">
            <span class="result-type">${item.type}</span>
            <span class="result-url">${item.url}</span>
          </div>
          <div class="result-title">
            <a href="${item.url}" target="_blank" rel="noopener">${item.title}</a>
          </div>
          <div class="result-snippet">${item.snippet}</div>
        `;
        container.appendChild(card);
      });
    }

    function filterResults(category, element) {
      document.querySelectorAll('.filter-tag').forEach(tag => tag.classList.remove('active'));
      element.classList.add('active');
      currentCategory = category;
      executeSearch();
    }

    // Listener para buscar al presionar la tecla Enter
    document.getElementById('engineQuery').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') executeSearch();
    });

    // Ejecutar búsqueda inicial al cargar el motor
    executeSearch();
  </script>
</body>
</html>
